<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sqour-arb | تسجيل الدخول</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, #0f172a, #111827);
        color: #e2e8f0;
        font-family: Tahoma, sans-serif;
      }
      .card {
        width: min(420px, 88vw);
        background: rgba(15, 23, 42, 0.92);
        padding: 28px;
        border-radius: 18px;
        box-shadow: 0 25px 60px rgba(0,0,0,0.35);
      }
      h2 { margin-top: 0; }
      input, button {
        width: 100%;
        box-sizing: border-box;
        padding: 12px 14px;
        border-radius: 10px;
        margin-top: 12px;
        font-size: 16px;
      }
      input {
        border: 1px solid #334155;
        background: rgba(15,23,42,0.7);
        color: white;
      }
      button {
        border: none;
        background: linear-gradient(135deg, #2563eb, #22c55e);
        color: white;
        font-weight: bold;
        cursor: pointer;
      }
      .alert {
        display: none;
        margin-top: 12px;
        color: #fca5a5;
      }
      .nav {
        margin-top: 16px;
        text-align: center;
      }
      .nav a { color: #93c5fd; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>تسجيل الدخول</h2>
      <div id="alert" class="alert"></div>
      <input id="username" placeholder="اسم المستخدم" />
      <input id="password" type="password" placeholder="كلمة المرور" />
      <button id="loginBtn">دخول</button>
      <div class="nav"><a href="/chat">فتح الدردشة</a></div>
    </div>

    <script>
      const alertBox = document.getElementById('alert');
      document.getElementById('loginBtn').addEventListener('click', async () => {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        if (!username || !password) {
          alertBox.style.display = 'block';
          alertBox.textContent = 'يرجى إدخال اسم المستخدم وكلمة المرور.';
          return;
        }

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          const data = await res.json();
          if (!res.ok) throw new Error(data.message || 'Login failed');

          localStorage.setItem('sqourToken', data.token);
          localStorage.setItem('sqourUser', JSON.stringify(data.user));
          window.location.href = '/chat';
        } catch (error) {
          alertBox.style.display = 'block';
          alertBox.textContent = error.message;
        }
      });
    </script>
  </body>
</html>
