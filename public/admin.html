<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sqour-arb | لوحة الإدارة</title>
    <style>
      body { margin: 0; font-family: Tahoma, sans-serif; background: #020817; color: #e2e8f0; }
      .wrap { max-width: 1100px; margin: 40px auto; padding: 20px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
      .card { background: #111827; padding: 18px; border-radius: 14px; border: 1px solid #334155; }
      table { width: 100%; border-collapse: collapse; margin-top: 18px; }
      th, td { padding: 12px; text-align: right; border-bottom: 1px solid #334155; }
      .pill { display: inline-block; background: #1d4ed8; color: white; border-radius: 999px; padding: 6px 10px; font-size: 12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h2>لوحة الإدارة</h2>
      <div class="grid">
        <div class="card"><h3>إجمالي المستخدمين</h3><strong id="usersCount">0</strong></div>
        <div class="card"><h3>إجمالي الغرف</h3><strong id="roomsCount">0</strong></div>
        <div class="card"><h3>المشرفين</h3><strong id="adminsCount">0</strong></div>
      </div>

      <div class="card" style="margin-top: 24px;">
        <h3>المستخدمون</h3>
        <table>
          <thead>
            <tr><th>المستخدم</th><th>الدور</th><th>تاريخ الإنشاء</th></tr>
          </thead>
          <tbody id="usersTable"></tbody>
        </table>
      </div>
    </div>

    <script>
      const token = localStorage.getItem('sqourToken');
      if (!token) window.location.href = '/';

      async function loadAdmin() {
        const res = await fetch('/api/admin/overview', {
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();
        if (!data.ok) {
          alert(data.message || 'Access denied');
          return;
        }

        document.getElementById('usersCount').textContent = data.stats.users;
        document.getElementById('roomsCount').textContent = data.stats.rooms;
        document.getElementById('adminsCount').textContent = data.stats.admins;
      }

      async function loadUsers() {
        const res = await fetch('/api/users', {
          headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();
        const tbody = document.getElementById('usersTable');
        tbody.innerHTML = '';
        if (!data.ok) return;

        data.users.forEach((user) => {
          const tr = document.createElement('tr');
          tr.innerHTML = `<td>${user.displayName || user.username}</td><td><span class="pill">${user.role}</span></td><td>${new Date(user.createdAt).toLocaleString()}</td>`;
          tbody.appendChild(tr);
        });
      }

      loadAdmin();
      loadUsers();
    </script>
  </body>
</html>
